name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      # Os testes usam mocks no lugar do Supabase, então não precisam de secrets.
      # Meta mínima de cobertura definida no README: 75%.
      - name: Rodar testes com cobertura
        run: pytest --cov=app --cov-report=term --cov-report=xml --cov-fail-under=75

      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    name: Frontend (vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes com cobertura
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo melhora a análise de código novo

      - uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend

      - uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

      # Os relatórios são gerados dentro de backend/ e frontend/, mas o Sonar
      # analisa a partir da raiz do repositório.
      - name: Ajustar caminhos dos relatórios de cobertura
        run: |
          sed -i 's#<source>app</source>#<source>backend/app</source>#' backend/coverage.xml
          sed -i 's#^SF:#SF:frontend/#' frontend/coverage/lcov.info

      - uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
